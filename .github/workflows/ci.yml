name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: plugin
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Typecheck the Figma plugin
        run: npx tsc --noEmit -p .
        working-directory: plugin
      - run: npm run check
      - name: Package contents
        run: npm pack --dry-run

  # The Claude Code plugin runs dist/ and figma-plugin/ straight from the repo, so they must be what the source builds to.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if the committed build is out of date
        run: |
          if [ -n "$(git status --porcelain dist figma-plugin)" ]; then
            git status --short dist figma-plugin
            echo "::error::dist/ or figma-plugin/ is out of date. Run npm run build and commit the result."
            exit 1
          fi

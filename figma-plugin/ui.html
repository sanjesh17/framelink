<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FrameLink</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #161616;
      color: #fff;
      width: 300px;
      height: 220px;
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 14px;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.35);
    }

    .logo svg { width: 14px; height: 14px; }

    .brand {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.3px;
      color: #f5f5f5;
      flex: 1;
    }

    .version {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #444;
      background: #232323;
      padding: 3px 7px;
      border-radius: 4px;
    }

    /* ── Status card ── */
    .card {
      position: relative;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      background: #1e1e1e;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      transition: border-color 0.4s ease, background 0.4s ease;
    }

    .card.connected {
      border-color: #1c3a28;
      background: #172318;
    }

    /* shimmer overlay — shown while connecting */
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 20%,
        rgba(255,255,255,0.04) 50%,
        transparent 80%
      );
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite linear;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .card.connected::after,
    .card.disconnected::after {
      opacity: 0;
      animation: none;
    }

    @keyframes shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    /* dot */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    .dot.connecting {
      background: #555;
    }

    .dot.connected {
      background: #34c759;
      box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.5);
      animation: pulse 2.2s ease-out infinite;
    }

    .dot.disconnected {
      background: #ff453a;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.5); }
      60%  { box-shadow: 0 0 0 6px rgba(52, 199, 89, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
    }

    /* text */
    .status-meta { display: flex; flex-direction: column; gap: 2px; }

    .status-label {
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #3a3a3a;
    }

    .status-text {
      font-size: 12px;
      font-weight: 450;
      color: #555;
      transition: color 0.4s ease;
    }

    .status-text.connected { color: #4ade80; }
    .status-text.disconnected { color: #ff6b6b; }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: #222;
    }

    /* ── Hint ── */
    .hint {
      font-size: 11px;
      color: #3a3a3a;
      line-height: 1.55;
    }

    .hint strong {
      color: #7c3aed;
      font-weight: 500;
    }

    /* ── Footer ── */
    .footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-text {
      font-size: 9.5px;
      color: #2e2e2e;
      letter-spacing: 0.2px;
    }

    .port-badge {
      font-size: 9px;
      color: #333;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Menlo', monospace;
      letter-spacing: 0.3px;
      transition: color 0.4s ease, border-color 0.4s ease;
    }

    .port-badge.connected {
      color: #2d6a3f;
      border-color: #1c3a28;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="5.5" height="5.5" rx="1.2" fill="white" opacity="0.95"/>
        <rect x="7.5" y="1" width="5.5" height="5.5" rx="1.2" fill="white" opacity="0.5"/>
        <rect x="1" y="7.5" width="5.5" height="5.5" rx="1.2" fill="white" opacity="0.5"/>
        <rect x="7.5" y="7.5" width="5.5" height="5.5" rx="1.2" fill="white" opacity="0.25"/>
      </svg>
    </div>
    <span class="brand">FrameLink</span>
    <span class="version">v2</span>
  </div>

  <div class="card" id="card">
    <div class="dot connecting" id="dot"></div>
    <div class="status-meta">
      <div class="status-label">Bridge Status</div>
      <div class="status-text" id="statusText">Connecting...</div>
    </div>
    <div class="port-badge" id="portBadge">:3333</div>
  </div>

  <div class="divider"></div>

  <div class="hint">
    Select a frame, then ask <strong>Claude</strong> to generate code.
  </div>

  <script>
    let ws = null;
    const dot = document.getElementById('dot');
    const card = document.getElementById('card');
    const statusText = document.getElementById('statusText');
    const portBadge = document.getElementById('portBadge');

    function setState(state) {
      dot.className = 'dot ' + state;
      card.className = 'card ' + state;
      statusText.className = 'status-text ' + state;

      if (state === 'connected') {
        statusText.textContent = 'Connected';
        portBadge.className = 'port-badge connected';
      } else if (state === 'disconnected') {
        statusText.textContent = 'Bridge not found';
        portBadge.className = 'port-badge';
      } else {
        statusText.textContent = 'Connecting...';
        portBadge.className = 'port-badge';
      }
    }

    function connect() {
      setState('connecting');
      try {
        ws = new WebSocket('ws://localhost:3333');

        ws.onopen = () => setState('connected');

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          parent.postMessage({ pluginMessage: msg }, '*');
        };

        ws.onerror = () => setState('disconnected');

        ws.onclose = () => {
          setState('disconnected');
          setTimeout(connect, 3000);
        };
      } catch {
        setState('disconnected');
        setTimeout(connect, 3000);
      }
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    };

    connect();
  </script>
</body>
</html>
